name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --------------------------------------------------
  # 1. Backend: Install, Prisma Generate & Build
  # --------------------------------------------------
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Backend
        run: npm run build

  # --------------------------------------------------
  # 2. Frontend: Install & Build Next.js
  # --------------------------------------------------
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://smart-desk-sql.onrender.com' }}
        run: npm run build

  # --------------------------------------------------
  # 3. Simple Deploy (Triggers only when pushed to main)
  # --------------------------------------------------
  deploy:
    name: Trigger Deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend (Render)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Deploying backend to Render..."
            curl -s -X POST "$RENDER_HOOK"
            echo "Done!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set, skipping backend deploy."
          fi

      - name: Deploy Frontend (Vercel)
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "Deploying frontend to Vercel..."
            curl -s -X POST "$VERCEL_HOOK"
            echo "Done!"
          else
            echo "VERCEL_DEPLOY_HOOK_URL secret not set, skipping frontend deploy."
          fi
