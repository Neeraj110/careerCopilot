<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#93C5FD" />
      <stop offset="75%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  
  <!-- Outer border -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#ringGrad)" />
  
  <!-- Inner area -->
  <rect x="7" y="7" width="34" height="34" rx="10" fill="#0C0C0E" />
  
  <!-- Diamond in center (rotated square) -->
  <g transform="translate(24, 24) rotate(45)">
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="url(#diamondGrad)" />
  </g>
  
  <!-- Sparkles -->
  <circle cx="20" cy="22" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="29" cy="27" r="1" fill="#ffffff" opacity="0.8" />
</svg>
